      operationId: Amendmentdetails
      parameters:
      - $ref: './swagger.yaml#/components/parameters/congress'
      - $ref: '#/components/parameters/amendmentType'
      - $ref: '#/components/parameters/amendmentNumber'
      - $ref: './swagger.yaml#/components/parameters/format'
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/amendmentDetail'
            application/xml:
              schema:
                $ref: '#/components/schemas/amendmentDetail'
        "400":
          description: Invalid status value
          content: {}
