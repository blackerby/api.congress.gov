      - $ref: '#/components/parameters/amendmentType'
      - $ref: '#/components/parameters/amendmentNumber'
      - $ref: './swagger.yaml#/components/parameters/format'
      - $ref: './swagger.yaml#/components/parameters/offset'
      - $ref: './swagger.yaml#/components/parameters/limit'
      responses:
        "200":
          description: Successful operation
          content: {}
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
  text:
    get:
      tags:
      - amendments
      summary: Returns the list of text versions for a specified amendment from the
        117th Congress onwards.
      description: |
        GET /amendment/:congress/:amendmentType/:amendmentNumber/text

        **Example Request**

        https://api.congress.gov/v3/amendment/117/hamdt/287/text?api_key=[INSERT_KEY]

        **Example Response**

             {
                "textVersions": [
                    {
                        "date": "2022-07-14T06:20:29Z",
                        "formats": [
                            {
                                "type": "PDF",
                                "url":"https://www.congress.gov/117/crec/2022/07/13/168/115/CREC-2022-07-13-pt2-PgH6339-2.pdf"
                            },
                            {
                                "type": "Formatted XML",
                                "url": "https://www.congress.gov/117/crec/2022/07/13/168/115/modified/CREC-2022-07-13-pt2-PgH6339-2.htm"
                            }
                        ],
                        "type": "Offered"
                    },
                ]
             }
      operationId: amendmentsText
      parameters:
      - $ref: './swagger.yaml#/components/parameters/congress'
      - $ref: '#/components/parameters/amendmentType'
      - $ref: '#/components/parameters/amendmentNumber'
      - $ref: './swagger.yaml#/components/parameters/format'
      - $ref: './swagger.yaml#/components/parameters/offset'
      - $ref: './swagger.yaml#/components/parameters/limit'
      responses:
        "200":
          description: Successful operation
          content: {}
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
components:
  parameters:
    amendmentType:
      name: amendmentType
      in: path
      description: The type of amendment. Value can be hamdt or samdt.
      required: true
      schema:
        type: string
    amendmentNumber:
      name: amendmentNumber
      in: path
      description: The bill's assigned number. For example, the value can be 287.
      required: true
      schema:
        type: integer
  schemas:
    amendment:
      type: object
      properties:
        congress:
          type: string
        type:
          $ref: '#/components/schemas/amendmentType'
        number:
          type: string
        purpose:
          type: string
        url:
          type: string
        latestAction:
          $ref: './swagger.yaml#/components/schemas/latestAction'
    amendments:
      type: object
      properties:
        amendments:
          type: array
          items:
            $ref: '#/components/schemas/amendment'
    amendmentDetail:
      type: object
      properties:
        actions:
          $ref: '#/components/schemas/count'
        amendedBill:
          type: object
          properties:
            congress:
              $ref: './swagger.yaml#/components/schemas/congress'
            number:
              type: string
            originChamber:
              $ref: './swagger.yaml#/components/schemas/chamber'
            originChamberCode:
              $ref: './swagger.yaml#/components/schemas/chamberCode'
            title:
              type: string
            type:
              $ref: './bill.yaml#/components/schemas/billType'
            url:
              type: string
        amendmentsToAmendment:
          $ref: '#/components/schemas/count'
        chamber:
          $ref: './swagger.yaml#/components/schemas/chamber'
        congress:
          $ref: './swagger.yaml#/components/schemas/congress'
        cosponsors:
          type: object
          properties:
            count:
              type: integer
            countIncludingWithdrawnCosponsors:
              type: integer
            url:
              type: string
        latestAction:
          $ref: './swagger.yaml#/components/schemas/latestAction'
        number:
          type: string
        proposedDate:
          type: string
          format: date-time
        purpose:
          type: string
        sponsors:
          type: array
          items:
            type: object
            properties:
              bioguideId:
                type: string
                pattern: '^[A-Z]\d{6}$'
              firstName:
                type: string
              fullName:
                type: string
              lastName:
                type: string
              url:
                type: string
        submittedDate:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/amendmentType'
        updatedDate:
          type: string
          format: date-time
    amendmentType:
      type: string
      enum:
      - SAMDT
      - HAMDT
    count:
      type: object
      properties:
        count:
          type: integer
        url:
          type: string

