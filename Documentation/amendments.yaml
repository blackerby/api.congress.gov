paths:
  amendment:
    get:
      tags:
      - amendments
      summary: Returns a list of amendments sorted by date of latest action.
      description: |
        GET /amendment/

        **Example Request**

        https://api.congress.gov/v3/amendment?api_key=[INSERT_KEY]

        **Example Response**

            {
                "amendments": [
                    {
                       "congress": 117,
                       "latestAction": {
                            "actionDate": "2021-08-08",
                            "text": "Amendment SA 2137 agreed to in Senate by Yea-Nay Vote. 69 - 28. Record Vote Number: 312."
                        },
                        "number": "2137",
                        "purpose": "In the nature of a substitute.",
                        "type": "SAMDT",
                        "url": "http://api.congress.gov/v3/amendment/117/samdt/2137?format=json"
                    },
                    {
                        "congress": 117,
                        "latestAction": {
                            "actionDate": "2021-08-08",
                            "text": "Amendment SA 2131 agreed to in Senate by Voice Vote. "
                        },
                        "number": "2131",
                        "purpose": "To strike a definition.",
                        "type": "SAMDT",
                        "updateDate": "2022-02-25T17:34:49Z",
                        "url": "https://api.congress.gov/v3/amendment/117/samdt/2131?format=json"
                    }
                ],
             }
      operationId: Amendment
      parameters:
      - $ref: './swagger.yaml#/components/parameters/format'
      - $ref: './swagger.yaml#/components/parameters/offset'
      - $ref: './swagger.yaml#/components/parameters/limit'
      - $ref: './swagger.yaml#/components/parameters/fromDateTime'
      - $ref: './swagger.yaml#/components/parameters/toDateTime'
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/amendments'
            application/xml:
              schema:
                $ref: '#/components/schemas/amendments'
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
  congress:
    get:
      tags:
      - amendments
      summary: "Returns a list of amendments filtered by the specified congress, sorted by date of latest action."
      description: |
        GET /amendment/:congress

        **Example Request**

        https://api.congress.gov/v3/amendment/117?api_key=[INSERT_KEY]

        **Example Response**

            {
                "amendments": [
                    {
                       "congress": 117,
                       "latestAction": {
                            "actionDate": "2021-08-08",
                            "text": "Amendment SA 2137 agreed to in Senate by Yea-Nay Vote. 69 - 28. Record Vote Number: 312."
                        },
                        "number": "2137",
                        "purpose": "In the nature of a substitute.",
                        "type": "SAMDT",
                        "url": "http://api.congress.gov/v3/amendment/117/samdt/2137?format=json"
                    },
                    {
                        "congress": 117,
                        "latestAction": {
                            "actionDate": "2021-08-08",
                            "text": "Amendment SA 2131 agreed to in Senate by Voice Vote. "
                        },
                        "number": "2131",
                        "purpose": "To strike a definition.",
                        "type": "SAMDT",
                        "updateDate": "2022-02-25T17:34:49Z",
                        "url": "https://api.congress.gov/v3/amendment/117/samdt/2131?format=json"
                    }
                ],
             }
      operationId: Amendmentcongress
      parameters:
      - $ref: './swagger.yaml#/components/parameters/congress'
      - $ref: './swagger.yaml#/components/parameters/format'
      - $ref: './swagger.yaml#/components/parameters/offset'
      - $ref: './swagger.yaml#/components/parameters/limit'
      - $ref: './swagger.yaml#/components/parameters/fromDateTime'
      - $ref: './swagger.yaml#/components/parameters/toDateTime'
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/amendments'
            application/xml:
              schema:
                $ref: '#/components/schemas/amendments'
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
  type:
    get:
      tags:
      - amendments
      summary: "Returns a list of amendments filtered by the specified congress and\
        \ amendment type, sorted by date of latest action."
      description: |
        GET /amendment/:congress/:amendmentType

        **Example Request**

        https://api.congress.gov/v3/amendment/117/samdt?api_key=[INSERT_KEY]

        **Example Response**

            {
                "amendments": [
                    {
                       "congress": 117,
                       "latestAction": {
                            "actionDate": "2021-08-08",
                            "text": "Amendment SA 2137 agreed to in Senate by Yea-Nay Vote. 69 - 28. Record Vote Number: 312."
                        },
                        "number": "2137",
                        "purpose": "In the nature of a substitute.",
                        "type": "SAMDT",
                        "url": "http://api.congress.gov/v3/amendment/117/samdt/2137?format=json"
                    },
                    {
                        "congress": 117,
                        "latestAction": {
                            "actionDate": "2021-08-08",
                            "text": "Amendment SA 2131 agreed to in Senate by Voice Vote. "
                        },
                        "number": "2131",
                        "purpose": "To strike a definition.",
                        "type": "SAMDT",
                        "updateDate": "2022-02-25T17:34:49Z",
                        "url": "https://api.congress.gov/v3/amendment/117/samdt/2131?format=json"
                    }
                ],
             }
      operationId: Amendmentlist
      parameters:
      - $ref: './swagger.yaml#/components/parameters/congress'
      - $ref: '#/components/parameters/amendmentType'
      - $ref: './swagger.yaml#/components/parameters/format'
      - $ref: './swagger.yaml#/components/parameters/offset'
      - $ref: './swagger.yaml#/components/parameters/limit'
      - $ref: './swagger.yaml#/components/parameters/fromDateTime'
      - $ref: './swagger.yaml#/components/parameters/toDateTime'
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/amendments'
            application/xml:
              schema:
                $ref: '#/components/schemas/amendments'
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
  number:
    get:
      tags:
      - amendments
      summary: Returns detailed information for a specified amendment.
      description: |
        GET /amendment/:congress/:amendmentType/:amendmentNumber

        **Example Request**

        https://api.congress.gov/v3/amendment/117/samdt/2137?api_key=[INSERT_KEY]

        **Example Response**

            {
                "amendment": {
                    "actions": {
                        "count": 19,
                        "url": "https://api.congress.gov/v3/amendment/117/samdt/2137/actions?format=json"
                    },
                    "amendedBill": {
                        "congress": 117,
                        "number": "3684",
                        "originChamber": "House",
                        "originChamberCode": "H",
                        "title": "Infrastructure Investment and Jobs Act",
                        "type": "HR",
                        "url": "https://api.congress.gov/v3/bill/117/hr/3684?format=json"
                    },
                    "amendmentsToAmendment": {
                         "count": 507,
                         "url": "https://api.congress.gov/v3/amendment/117/samdt/2137/amendments?format=json"
                    },
                    "chamber": "Senate",
                    "congress": 117,
                    "cosponsors": {
                        "count": 9,
                        "countIncludingWithdrawnCosponsors": 9,
                        "url": "https://api.congress.gov/v3/amendment/117/samdt/2137/cosponsors?format=json"
                    },
                    "latestAction": {
                        "actionDate": "2021-08-08",
                        "text": "Amendment SA 2137 agreed to in Senate by Yea-Nay Vote. 69 - 28. Record Vote Number: 312."
                    },
                    "number": "2137",
                    "proposedDate": "2021-08-01T04:00:00Z",
                    "purpose": "In the nature of a substitute.",
                    "sponsors": [
                        {
                            "bioguideId": "S001191",
                            "firstName": "Kyrsten",
                            "fullName": "Sen. Sinema, Kyrsten [D-AZ]",
                            "lastName": "Sinema",
                            "url": "https://api.congress.gov/v3/member/S001191?format=json"
                        }
                    ],
                    "submittedDate": "2021-08-01T04:00:00Z",
                    "type": "SAMDT"
                    "updateDate": "2022-02-08T17:27:59Z",
