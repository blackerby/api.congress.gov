components:
  parameters:
    billType:
      name: billType
      in: path
      description: "The type of bill."
      required: true
      schema:
        type: string
        enum:
          - hr
          - s
          - hjres
          - sjres
          - hconres
          - sconres
          - hres
          - sres
    billNumber:
      name: "billNumber"
      in: path
      description: The bill's assigned number. For example, the value can be 3076.
      required: true
      schema:
        type: integer
  schemas:
    billType:
      type: string
      enum:
        - HR
        - S
        - HJRES
        - SJRES
        - HCONRES
        - SCONRES
        - HRES
        - SRES
