      parameters:
      - name: bioguideId
        in: path
        description: "The bioguide identifier for the congressional member. For example,\
          \ the value can be L000174."
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: The data format. Value can be xml or json.
        schema:
          type: string
      - name: offset
        in: query
        description: The starting record returned. 0 is the first record.
        schema:
          type: integer
      - name: limit
        in: query
        description: The number of records returned. The maximum limit is 250.
        schema:
          type: integer
      responses:
        "200":
          description: Successful operation
          content: {}
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
