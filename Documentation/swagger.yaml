             ]
            }
      operationId: member_list_by_congress_state_district
      parameters:
      - name: congress
        in: path
        description: "The Congress number. For example, 118."
        required: true
        schema:
          type: integer
      - name: stateCode
        in: path
        description: "The two letter identifier for the state the member represents.\
          \ For example, the value can be MI for Michigan."
        required: true
        schema:
          type: string
      - name: district
        in: path
        description: "The district number for the district the member represents.\
          \ For example, the value can be 10."
        required: true
        schema:
          type: integer
      - name: format
        in: query
        description: The data format. Value can be xml or json.
        schema:
          type: string
      - name: currentMember
        in: query
        description: The status of the member. Use true or false. Use currentMember=True
          for the current congress data only.
        schema:
          type: string
      responses:
        "200":
          description: Successful operation
          content: {}
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
  /committee:
    get:
      tags:
      - committee
      summary: Returns a list of congressional committees.
      description: |
        GET /committee

        **Example Request**

        https://api.congress.gov/v3/committee?api_key=[INSERT_KEY]

        **Example Response**

            {
                 "committees": [
                    {
                        "chamber": "House",
                        "committeeTypeCode": "Standing",
