openapi: 3.0.1
info:
  version: "3.0"
  title: Congress.gov API
  description: |
    Congress.gov shares its application programming interface (API) with the public to ingest the Congressional data. <a href="sign-up/" target="_blank">Sign up for an API key</a> from api.data.gov that you can use to access web services provided by Congress.gov. To learn more, view our <a href="https://github.com/LibraryOfCongress/api.congress.gov/" target="_blank">GitHub repository</a>.
servers:
- url: /v3
tags:
- name: bill
  description: Returns bill data from the API
- name: amendments
  description: Returns amendment data from the API
- name: summaries
  description: Returns summaries data from the API
- name: congress
  description: Returns congress and congressional sessions data from the API
- name: member
  description: Returns member data from the API
- name: committee
  description: Returns committee data from the API
- name: committee-report
  description: Returns committee report data from the API
- name: committee-print
  description: Returns committee print data from the API
- name: committee-meeting
  description: Returns committee meeting data from the API
- name: hearing
  description: Returns hearing data from the API
- name: congressional-record
  description: Returns Congressional Record data from the API
- name: daily-congressional-record
  description: Returns daily Congressional Record data from the API
- name: bound-congressional-record
  description: Returns bound Congressional Record data from the API
- name: house-communication
  description: Returns House communication data from the API
- name: house-requirement
  description: Returns House requirement data from the API
- name: senate-communication
  description: Returns Senate communication data from the API
- name: nomination
  description: Returns nomination data from the API
- name: crsreport
  description: Returns Congressional Research Service (CRS) report data from the API
- name: treaty
  description: Returns treaty data from the API
paths:
  /amendment:
    $ref: './amendments.yaml#/paths/amendment'
  /amendment/{congress}:
    $ref: './amendments.yaml#/paths/congress'
  /amendment/{congress}/{amendmentType}:
    $ref: './amendments.yaml#/paths/type'
  /amendment/{congress}/{amendmentType}/{amendmentNumber}:
    $ref: './amendments.yaml#/paths/number'
  /amendment/{congress}/{amendmentType}/{amendmentNumber}/actions:
    $ref: './amendments.yaml#/paths/actions'
  /amendment/{congress}/{amendmentType}/{amendmentNumber}/cosponsors:
    $ref: './amendments.yaml#/paths/cosponsors'
  /amendment/{congress}/{amendmentType}/{amendmentNumber}/amendments:
    $ref: './amendments.yaml#/paths/amendments'
  /amendment/{congress}/{amendmentType}/{amendmentNumber}/text:
    $ref: './amendments.yaml#/paths/text'
  /bill:
    $ref: './bill.yaml#/paths/bill'
  /bill/{congress}:
    $ref: './bill.yaml#/paths/congress'
  /bill/{congress}/{billType}:
    $ref: './bill.yaml#/paths/type'
  /bill/{congress}/{billType}/{billNumber}:
    $ref: './bill.yaml#/paths/number'
  /bill/{congress}/{billType}/{billNumber}/actions:
    $ref: './bill.yaml#/paths/actions'
  /bill/{congress}/{billType}/{billNumber}/amendments:
    $ref: './bill.yaml#/paths/amendments'
  /bill/{congress}/{billType}/{billNumber}/committees:
    $ref: './bill.yaml#/paths/committees'
  /bill/{congress}/{billType}/{billNumber}/cosponsors:
    $ref: './bill.yaml#/paths/cosponsors'
  /bill/{congress}/{billType}/{billNumber}/relatedbills:
    $ref: './bill.yaml#/paths/relatedbills'
  /bill/{congress}/{billType}/{billNumber}/subjects:
    $ref: './bill.yaml#/paths/subjects'
  /bill/{congress}/{billType}/{billNumber}/summaries:
    $ref: './bill.yaml#/paths/summaries'
  /bill/{congress}/{billType}/{billNumber}/text:
    $ref: './bill.yaml#/paths/text'
  /bill/{congress}/{billType}/{billNumber}/titles:
    $ref: './bill.yaml#/paths/titles'
  /summaries:
    $ref: './summaries.yaml#/paths/summaries'
  /summaries/{congress}:
    $ref: './summaries.yaml#/paths/congress'
  /summaries/{congress}/{billType}:
    $ref: './summaries.yaml#/paths/type'
  /law/{congress}:
    $ref: './law.yaml#/paths/congress'
  /law/{congress}/{lawType}:
    $ref: './law.yaml#/paths/type'
  /law/{congress}/{lawType}/{lawNumber}:
    $ref: './law.yaml#/paths/number'
  /congress:
    $ref: './congress.yaml#/paths/congresses'
  /congress/{congress}:
    $ref: './congress.yaml#/paths/congress'
  /congress/current:
    $ref: './congress.yaml#/paths/current'
  /member:
    get:
      tags:
      - member
      summary: Returns a list of congressional members.
      description: |
        GET /member

        **Example Request**

        https://api.congress.gov/v3/member?api_key=[INSERT_KEY]

        **Example Response**

            {
                "members": [
                {
                    "bioguideId": "L000174",
                    "depiction": {
                        "attribution": "<a href=\"http://www.senate.gov/artandhistory/history/common/generic/Photo_Collection_of_the_Senate_Historical_Office.htm\">Courtesy U.S. Senate Historical Office</a>",
                        "imageUrl": "https://www.congress.gov/img/member/l000174_200.jpg"
                    },
                    "district": null,
                    "name": "Leahy, Patrick J.",
                    "partyName": "Democratic",
                    "state": "Vermont",
                    "terms": {
                        "item": [
                            {
                                "chamber": Senate,
                                "endYear": null,
                                "startYear": 1975
                            }
                        ]
                    },
                    "updateDate": "2022-11-07T13:42:19Z",
                    "url": "https://api.congress.gov/v3/member/L000174?format=json"
                },
                {
                    "bioguideId": "K000377",
                    "depiction": {
                        "attribution": "<a href=\"http://www.senate.gov/artandhistory/history/common/generic/Photo_Collection_of_the_Senate_Historical_Office.htm\">Courtesy U.S. Senate Historical Office</a>",
                        "imageUrl": "https://www.congress.gov/img/member/k000377_200.jpg"
                    },
                    "district": null,
                    "name": "Kelly, Mark",
                    "partyName": "Democratic",
                    "state": "Arizona",
                    "terms": {
                        "item": [
                            {
                                "chamber": Senate,
                                "end": null,
                                "start": 2020
                            }
                        ]
                    },
                    "updateDate": "2023-04-01T12:42:17Z",
                    "url": "https://api.congress.gov/v3/member/K000377?format=json"
                },
              ]
            }
      operationId: member_list
      parameters:
      - name: format
        in: query
        description: The data format. Value can be xml or json.
        schema:
          type: string
      - name: offset
        in: query
        description: The starting record returned. 0 is the first record.
        schema:
          type: integer
      - name: limit
        in: query
        description: The number of records returned. The maximum limit is 250.
        schema:
          type: integer
      - name: fromDateTime
        in: query
        description: "The starting timestamp to filter by update date. Use format:\
          \ YYYY-MM-DDT00:00:00Z."
        schema:
          type: string
      - name: toDateTime
        in: query
        description: "The ending timestamp to filter by update date. Use format: YYYY-MM-DDT00:00:00Z."
        schema:
          type: string
      - name: currentMember
        in: query
        description: The status of the member. Use true or false.
        schema:
          type: string
      responses:
        "200":
          description: Successful operation
          content: {}
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
  /member/{bioguideId}:
    get:
      tags:
      - member
      summary: Returns detailed information for a specified congressional member.
      description: |
        GET /member/:bioguideId

        **Example Request**

        https://api.congress.gov/v3/member/L000174?api_key=[INSERT_KEY]

        **Example Response**

            {
                "member": {
                    "bioguideId": "L000174",
                    "birthYear": "1940",
                    "cosponsoredLegislation": {
