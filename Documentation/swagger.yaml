  /member/{stateCode}:
    get:
      tags:
      - member
      summary: Returns a list of members filtered by state.
      description: |
        GET /member/:stateCode

        **Example Request**

        https://api.congress.gov/v3/member/MI?api_key=[INSERT_KEY]

        **Example Response**

            {
               "members": [
               {
                   "bioguideId": "J000307",
                   "depiction": {
                       "attribution": "Image courtesy of the Member",
                       "imageUrl": "https://www.congress.gov/img/member/j000307_200.jpg"
               },
                   "district": 10,
                   "name": "James, John",
                   "partyName": "Republican",
                   "state": "Michigan",
                   "terms": {
                       "item": [
                           {
                               "chamber": "House of Representatives",
                               "startYear": 2023
                           }
                       ]
                   },
                   "updateDate": "2024-03-22T18:36:13Z",
                   "url": "http://api.congress.gov/v3/member/J000307?format=json"
             },
           ]
         }
      operationId: member_list_by_state
      parameters:
      - name: stateCode
        in: path
        description: "The two letter identifier for the state the member represents.\
          \ For example, the value can be MI for Michigan."
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: The data format. Value can be xml or json.
        schema:
          type: string
      - name: currentMember
        in: query
        description: The status of the member. Use true or false. Use currentMember=True
          for the current congress data only.
        schema:
          type: string
      responses:
        "200":
          description: Successful operation
          content: {}
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
