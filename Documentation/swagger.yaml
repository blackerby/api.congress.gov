  /member/congress/{congress}:
    get:
      tags:
      - member
      summary: Returns the list of members specified by Congress
      description: |
        GET /member/congress/:congress

        **Example Request**

        https://api.congress.gov/v3/member/congress/118?api_key=[INSERT_KEY]

        **Example Request for a previous Congress**

        https://api.congress.gov/v3/member/congress/117?currentMember=False&api_key=[INSERT_KEY]

        **Example Response**

            {
                "members": [
                {
                    "bioguideId": "B001320",
                    "depiction": {
                        "attribution": "Image courtesy of the Senator's office",
                        "imageUrl": "https://www.congress.gov/img/member/b001320_200.jpg"
                },
                    "name": "Butler, Laphonza R.",
                    "partyName": "Democratic",
                    "state": "California",
                    "terms": {
                        "item": [
                            {
                                "chamber": "Senate",
                                "startYear": 2023
                            }
                        ]
                    },
                    "updateDate": "2024-04-09T15:54:25Z",
                    "url": "http://api.congress.gov/v3/member/B001320?format=json"
                },
                {
                     "bioguideId": "A000376",
                     "depiction": {
                         "attribution": "Image courtesy of the Member",
                         "imageUrl": "https://www.congress.gov/img/member/a000376_200.jpg"
                },
                      "district": 32,
                      "name": "Allred, Colin Z.",
                      "partyName": "Democratic",
                      "state": "Texas",
                      "terms": {
                          "item": [
                              {
                                  "chamber": "House of Representatives",
                                  "startYear": 2019
                              }
                          ]
                      },
                     "updateDate": "2024-04-09T13:26:21Z",
                     "url": "http://api.congress.gov/v3/member/A000376?format=json"
                },
              ]
            }
      operationId: congress_members_list
      parameters:
      - name: congress
        in: path
        description: "The congress for the congressional member. For example, the\
          \ value can be 118."
        required: true
        schema:
          type: string
      - name: format
        in: query
        description: The data format. Value can be xml or json.
        schema:
          type: string
      - name: offset
        in: query
        description: The starting record returned. 0 is the first record.
        schema:
          type: integer
      - name: limit
        in: query
        description: The number of records returned. The maximum limit is 250.
        schema:
          type: integer
      - name: currentMember
        in: query
        description: The status of the member. Use true or false. Use currentMember=false
