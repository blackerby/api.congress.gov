paths:
  congress:
    get:
      tags:
      - bill
      summary: Returns a list of laws filtered by the specified congress.
      description: |
        GET /law/:congress

        **Example Request**

        https://api.congress.gov/v3/law/118?api_key=[INSERT_KEY]

        **Example Response**

