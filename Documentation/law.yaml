                        "updateDateIncludingText": "2024-03-18T20:28:27Z",
                        "url": "http://api.congress.gov/v3/bill/118/hjres/26?format=json"
                  },
                  {
                       "congress": 118,
                       "latestAction": {
                           "actionDate": "2023-07-26",
