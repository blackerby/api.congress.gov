      operationId: congress_list
      parameters:
      - $ref: './swagger.yaml#/components/parameters/format'
      - $ref: './swagger.yaml#/components/parameters/offset'
      - $ref: './swagger.yaml#/components/parameters/limit'
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
                schema:
                  $ref: '#/components/schemas/congresses'
            application/xml:
                schema:
                  $ref: '#/components/schemas/congresses'
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
  congress:
    get:
      tags:
      - congress
      summary: Returns detailed information for a specified congress.
      description: |
        GET /congress/:congress

        **Example Request**

        https://api.congress.gov/v3/congress/116?api_key=[INSERT_KEY]

        **Example Response**

            {
              "congress": {
                  "endYear": "2020",
                  "name": "116th Congress",
                  "number": 116,
                  "sessions": [
                      {
                          "chamber": "House of Representatives",
                          "endDate": "2020-01-03",
                          "number": 1,
                          "startDate": "2019-01-03",
                          "type": "R"
                      },
                      {
                          "chamber": "Senate",
                          "endDate": "2020-01-03",
                          "number": 1,
                          "startDate": "2019-01-03",
                          "type": "R"
                      },
                      {
                          "chamber": "House of Representatives",
                          "endDate": "2021-01-03",
                          "number": 2,
                          "startDate": "2020-01-03",
                          "type": "R"
                      },
                      {
                          "chamber": "Senate",
                          "endDate": "2021-01-03",
                          "number": 2,
                          "startDate": "2020-01-03",
                          "type": "R"
                      }
                  ],
                  "startYear": "2019",
                  "updateDate": "2019-01-03T18:37:12Z",
                  "url": "https://api.congress.gov/v3/congress/116?format=json"
              },
            }
      operationId: congress_details
      parameters:
      - $ref: './swagger.yaml#/components/parameters/congress'
      - $ref: './swagger.yaml#/components/parameters/format'
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/congress'
            application/xml:
              schema: 
                $ref: '#/components/schemas/congress'
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
  current:
    get:
      tags:
      - congress
      summary: Returns detailed information for the current congress.
      description: |
        GET /congress/current

        **Example Request**

        https://api.congress.gov/v3/congress/current?api_key=[INSERT_KEY]

        **Example Response**

            {
              "congress": {
                  "endYear": "2024",
                  "name": "118th Congress",
                  "number": 118,
                  "sessions": [
                      {
                          "chamber": "House of Representatives",
                          "endDate": "2024-01-03",
                          "number": 1,
                          "startDate": "2023-01-03",
                          "type": "R"
                      },
                      {
                           "chamber": "Senate",
                           "endDate": "2024-01-03",
                           "number": 1,
                           "startDate": "2023-01-03",
                           "type": "R"
                      },
                      {
                           "chamber": "Senate",
                           "number": 2,
                           "startDate": "2024-01-03",
                           "type": "R"
                      },
                      {
                           "chamber": "House of Representatives",
                           "number": 2,
                           "startDate": "2024-01-03",
                           "type": "R"
                      }
                  ],
                  "startYear": "2023",
                  "updateDate": "2023-01-03T17:43:32Z",
                  "url": "https://api.congress.gov/v3/congress/current?format=json"
              },
            }
      operationId: congress_current_list
      parameters:
      - $ref: './swagger.yaml#/components/parameters/format'
      - $ref: './swagger.yaml#/components/parameters/offset'
      - $ref: './swagger.yaml#/components/parameters/limit'
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/congress'
            application/xml:
              schema: 
                $ref: '#/components/schemas/congress'
        "400":
          description: Invalid status value
          content: {}
      security:
      - api_key: []
components:
    schemas:
        congresses: 
          type: object
          properties:
            congresses:
              type: array
              items:
                $ref: '#/components/schemas/congress'
        congress:
          type: object
          properties:
            name:
              type: string
            startYear:
              type: string
            endYear:
              type: string
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/session'
        session:
          type: object
          properties:
            chamber:
              type: string
              enum:
              - Senate
              - House of Representatives
            number:
              type: integer
              minimum: 1
              maximum: 2
            type:
              type: string
              enum:
              - R
              - S
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
              nullable: true
